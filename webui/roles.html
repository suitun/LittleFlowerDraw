<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色库</title>
  <style>
    * { box-sizing: border-box; }
    body { padding: 20px; line-height: 1.6; }
    main { max-width: 1280px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 0; }
    p { margin: 4px 0; }
    .muted { color: var(--maibot-muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .actions .maibot-input { width: 200px; }
    #status { min-height: 22px; font-size: 14px; }
    #status.error, .error { color: var(--maibot-danger); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .role-card { padding: 0; overflow: hidden; cursor: pointer; background: var(--maibot-surface); border: 1px solid var(--maibot-border); border-radius: var(--maibot-radius); outline: none; }
    .role-card:focus-visible { box-shadow: 0 0 0 3px var(--maibot-primary); }
    .role-cover { position: relative; aspect-ratio: 4 / 3; background: var(--maibot-soft); display: grid; place-items: center; overflow: hidden; }
    .role-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .role-cover-hint { color: var(--maibot-muted); font-size: 13px; padding: 8px; text-align: center; }
    .role-body { padding: 12px; }
    .role-name { font-size: 16px; margin: 0 0 4px; overflow-wrap: anywhere; }
    .role-meta { color: var(--maibot-muted); font-size: 12px; margin: 0; overflow-wrap: anywhere; }
    .role-actions { display: flex; gap: 8px; margin-top: 10px; }
    .role-actions button { flex: 1; }
    .empty { grid-column: 1 / -1; padding: 36px 16px; text-align: center; color: var(--maibot-muted); background: var(--maibot-card, var(--maibot-surface)); border: 1px dashed var(--maibot-border); border-radius: var(--maibot-radius); }
    .empty code { font-family: var(--maibot-font-mono, monospace); color: var(--maibot-foreground); }
    .pager { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 20px; }
    .modal { position: fixed; inset: 0; z-index: 50; padding: 20px; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; overflow: auto; }
    .modal-card { width: min(760px, 100%); max-height: 90vh; overflow: auto; padding: 20px; background: var(--maibot-surface); border: 1px solid var(--maibot-border); border-radius: var(--maibot-radius); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .preview-wrap { display: grid; place-items: center; min-height: 160px; margin-bottom: 14px; background: var(--maibot-background); border: 1px solid var(--maibot-border); border-radius: var(--maibot-radius); overflow: hidden; }
    .preview-wrap img { display: block; max-width: 100%; max-height: 60vh; object-fit: contain; }
    .preview-missing { padding: 24px; color: var(--maibot-muted); text-align: center; }
    .meta-list { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0 0 16px; font-size: 14px; }
    .meta-list dt { color: var(--maibot-muted); }
    .meta-list dd { margin: 0; overflow-wrap: anywhere; }
    .field-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .field-row .maibot-input { flex: 1; min-width: 180px; }
    .button-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .button-row .danger { color: var(--maibot-danger); }
    .upload-form { display: grid; gap: 12px; }
    .upload-form label { display: grid; gap: 6px; font-size: 14px; }
    .upload-preview { max-width: 100%; max-height: 260px; object-fit: contain; background: var(--maibot-background); border-radius: var(--maibot-radius); }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      body { padding: 12px; }
      .actions { width: 100%; }
      .actions .maibot-input { flex: 1; width: auto; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body class="maibot-page">
<main>
  <header>
    <div>
      <h1>小花绘 · 角色库</h1>
      <p id="stats" class="muted">正在加载…</p>
    </div>
    <div class="actions">
      <input id="search" class="maibot-input" type="search" placeholder="搜索角色名" aria-label="搜索角色名" autocomplete="off">
      <select id="sort" class="maibot-select" aria-label="排序方式">
        <option value="name">按名称</option>
        <option value="updated">按最近更新</option>
      </select>
      <button id="refresh" class="maibot-button" type="button">刷新</button>
      <button id="upload-new" class="maibot-button maibot-button-primary" type="button">上传角色</button>
    </div>
  </header>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="grid" class="grid" aria-label="角色列表"></section>
  <nav id="pager" class="pager" hidden>
    <button id="prev" class="maibot-button" type="button">上一页</button>
    <span id="page-label" class="muted"></span>
    <button id="next" class="maibot-button" type="button">下一页</button>
  </nav>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button id="modal-close" class="maibot-button" type="button">关闭</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<input id="replace-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>

<script>
  const state = {
    query: "",
    page: 1,
    pageSize: 20,
    sort: "name",
    total: 0,
    pages: 1,
    items: [],
    loading: false,
    selected: null
  };
  const thumbnailCache = new Map();
  const requestQueue = [];
  let runningRequests = 0;
  let searchTimer = 0;
  let uploadPreviewUrl = "";

  const statsElement = document.querySelector("#stats");
  const statusElement = document.querySelector("#status");
  const gridElement = document.querySelector("#grid");
  const pagerElement = document.querySelector("#pager");
  const pageLabel = document.querySelector("#page-label");
  const modal = document.querySelector("#modal");
  const modalTitle = document.querySelector("#modal-title");
  const modalBody = document.querySelector("#modal-body");
  const replaceFile = document.querySelector("#replace-file");

  function make(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function setStatus(message, isError = false) {
    statusElement.textContent = message || "";
    statusElement.className = isError ? "error" : "";
  }

  function setStats(stats) {
    statsElement.textContent = `角色 ${stats.roles} 个 · 占用 ${formatBytes(stats.image_bytes)} · 数据库 ${formatBytes(stats.database_bytes)}`;
  }

  function formatBytes(value) {
    const size = Number(value) || 0;
    if (size < 1024) return `${size} B`;
    if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
    return `${(size / 1024 / 1024).toFixed(1)} MB`;
  }

  function formatTime(value) {
    const seconds = Number(value) || 0;
    if (seconds <= 0) return "—";
    return new Date(seconds * 1000).toLocaleString("zh-CN", { hour12: false });
  }

  function ownerLabel(owner) {
    return owner === "webui" ? "WebUI 上传" : owner || "—";
  }

  // 页面桥接最多允许两个在途请求；缩略图、详情和操作共用名额。
  function request(kind, alias, args = {}) {
    return new Promise((resolve, reject) => {
      requestQueue.push({ kind, alias, args, resolve, reject });
      drainRequests();
    });
  }

  function uploadRequest(alias, file, args = {}, options = {}) {
    return new Promise((resolve, reject) => {
      requestQueue.push({ kind: "upload", alias, file, args, options, resolve, reject });
      drainRequests();
    });
  }

  function drainRequests() {
    while (runningRequests < 2 && requestQueue.length) {
      const job = requestQueue.shift();
      runningRequests++;
      const pending = job.kind === "upload"
        ? () => maibot.upload(job.alias, job.file, job.args, job.options)
        : () => maibot[job.kind](job.alias, job.args);
      Promise.resolve()
        .then(pending)
        .then(job.resolve, job.reject)
        .finally(() => {
          runningRequests--;
          drainRequests();
        });
    }
  }

  const thumbnailObserver = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      thumbnailObserver.unobserve(entry.target);
      loadThumbnail(entry.target.dataset.name, entry.target);
    }
  }, { rootMargin: "200px" });

  function clearThumbnailCache() {
    thumbnailCache.clear();
  }

  async function load(page = state.page) {
    if (state.loading) return;
    state.loading = true;
    document.querySelector("#refresh").disabled = true;
    setStatus("正在加载…");
    try {
      const result = await request("query", "roles", {
        query: state.query,
        page,
        page_size: state.pageSize,
        sort: state.sort
      });
      state.page = result.page;
      state.pages = result.pages;
      state.total = result.total;
      state.items = result.items;
      state.registerTemplate = result.register_template || "";
      setStats(result.stats);
      clearThumbnailCache();
      renderGrid();
      renderPager();
      setStatus(result.total ? `共 ${result.total} 个角色` : "");
    } catch (error) {
      setStatus(error.message || String(error), true);
    } finally {
      state.loading = false;
      document.querySelector("#refresh").disabled = false;
    }
  }

  function renderGrid() {
    thumbnailObserver.disconnect();
    gridElement.replaceChildren();
    if (!state.items.length) {
      const empty = make("div", "empty");
      empty.append(make("p", "", "还没有角色。"));
      if (state.query) {
        empty.append(make("p", "", `没有找到包含“${state.query}”的角色。`));
      } else if (state.registerTemplate) {
        const hint = make("p");
        hint.append(document.createTextNode("先在 QQ 里发送 "));
        hint.append(make("code", "", state.registerTemplate));
        hint.append(document.createTextNode(" 并附图，或者点右上角上传角色。"));
        empty.append(hint);
      } else {
        empty.append(make("p", "", "可以在 QQ 里登记角色，或者点右上角上传角色。"));
      }
      gridElement.append(empty);
      return;
    }
    for (const item of state.items) {
      gridElement.append(renderCard(item));
    }
  }

  function renderCard(item) {
    const card = make("article", "role-card");
    card.tabIndex = 0;
    card.dataset.name = item.name;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", `查看角色 ${item.name}`);

    const cover = make("div", "role-cover");
    cover.dataset.name = item.name;
    const hint = make("span", "role-cover-hint", "加载预览…");
    cover.append(hint);
    thumbnailObserver.observe(cover);

    const body = make("div", "role-body");
    body.append(make("h3", "role-name", item.name));
    body.append(make("p", "role-meta", `${formatBytes(item.image_bytes)} · ${ownerLabel(item.owner)}`));
    body.append(make("p", "role-meta", `更新：${formatTime(item.updated_at)}`));

    const actions = make("div", "role-actions");
    const viewButton = make("button", "maibot-button", "查看");
    viewButton.type = "button";
    viewButton.addEventListener("click", event => {
      event.stopPropagation();
      openDetail(item.name);
    });
    const deleteButton = make("button", "maibot-button", "删除");
    deleteButton.type = "button";
    deleteButton.addEventListener("click", event => {
      event.stopPropagation();
      deleteRole(item.name);
    });
    actions.append(viewButton, deleteButton);
    body.append(actions);

    card.append(cover, body);
    card.addEventListener("click", () => openDetail(item.name));
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openDetail(item.name);
      }
    });
    return card;
  }

  async function loadThumbnail(name, cover) {
    if (thumbnailCache.has(name)) {
      showThumbnail(cover, thumbnailCache.get(name));
      return;
    }
    try {
      const result = await request("query", "thumbnail", { name });
      if (result.image) {
        thumbnailCache.set(name, result.image);
        showThumbnail(cover, result.image);
      } else {
        cover.replaceChildren(make("span", "role-cover-hint error", result.error || "预览不可用"));
      }
    } catch (error) {
      cover.replaceChildren(make("span", "role-cover-hint error", error.message || "预览加载失败"));
    }
  }

  function showThumbnail(cover, source) {
    const image = make("img");
    image.alt = "";
    image.src = source;
    image.addEventListener("error", () => {
      cover.replaceChildren(make("span", "role-cover-hint error", "预览无法显示"));
    });
    cover.replaceChildren(image);
  }

  function renderPager() {
    pagerElement.hidden = state.pages <= 1;
    pageLabel.textContent = `第 ${state.page} / ${state.pages} 页`;
    document.querySelector("#prev").disabled = state.page <= 1;
    document.querySelector("#next").disabled = state.page >= state.pages;
  }

  function openModal(title, body) {
    modalTitle.textContent = title;
    modalBody.replaceChildren(body);
    modal.hidden = false;
    document.querySelector("#modal-close").focus();
  }

  function closeModal() {
    modal.hidden = true;
    modalBody.replaceChildren();
    state.selected = null;
    revokeUploadPreview();
  }

  async function openDetail(name) {
    openModal(name, make("p", "muted", "正在加载角色详情…"));
    try {
      const detail = await request("query", "detail", { name });
      state.selected = detail;
      if (!modal.hidden) renderDetail(detail);
    } catch (error) {
      if (!modal.hidden) openModal(name, make("p", "error", error.message || String(error)));
    }
  }

  function renderDetail(detail) {
    modalTitle.textContent = detail.name;
    const body = make("div");

    const previewWrap = make("div", "preview-wrap");
    if (detail.preview) {
      const image = make("img");
      image.src = detail.preview;
      image.alt = `${detail.name} 的图片`;
      previewWrap.append(image);
    } else {
      previewWrap.append(make("p", "preview-missing", detail.preview_error || "角色图片不可用"));
    }
    body.append(previewWrap);

    const meta = make("dl", "meta-list");
    const rows = [
      ["图片大小", formatBytes(detail.image_bytes)],
      ["登记者", ownerLabel(detail.owner)],
      ["登记时间", formatTime(detail.created_at)],
      ["更新时间", formatTime(detail.updated_at)]
    ];
    for (const [label, value] of rows) {
      meta.append(make("dt", "", label), make("dd", "", value));
    }
    body.append(meta);

    const renameRow = make("div", "field-row");
    const renameInput = make("input", "maibot-input");
    renameInput.type = "text";
    renameInput.value = detail.name;
    renameInput.maxLength = 256;
    renameInput.setAttribute("aria-label", "新的角色名");
    const renameButton = make("button", "maibot-button", "保存改名");
    renameButton.type = "button";
    renameRow.append(renameInput, renameButton);
    body.append(renameRow);

    const detailStatus = make("p", "muted");
    detailStatus.setAttribute("role", "status");
    body.append(detailStatus);

    renameButton.addEventListener("click", async () => {
      const newName = renameInput.value.trim();
      if (!newName) {
        detailStatus.textContent = "角色名不能为空";
        detailStatus.className = "error";
        return;
      }
      renameButton.disabled = true;
      try {
        const result = await request("action", "rename", { old_name: detail.name, new_name: newName });
        if (result.renamed) {
          clearThumbnailCache();
          closeModal();
          await load(state.page);
          setStatus("已重命名角色");
        } else {
          detailStatus.textContent = "名称没有变化";
          detailStatus.className = "muted";
        }
      } catch (error) {
        detailStatus.textContent = error.message || String(error);
        detailStatus.className = "error";
      } finally {
        renameButton.disabled = false;
      }
    });

    const buttonRow = make("div", "button-row");
    const replaceButton = make("button", "maibot-button", "替换图片");
    replaceButton.type = "button";
    replaceButton.addEventListener("click", () => {
      replaceFile.value = "";
      replaceFile.dataset.name = detail.name;
      replaceFile.click();
    });
    const deleteButton = make("button", "maibot-button danger", "删除角色");
    deleteButton.type = "button";
    deleteButton.addEventListener("click", () => deleteRole(detail.name));
    buttonRow.append(replaceButton, deleteButton);
    body.append(buttonRow);

    modalBody.replaceChildren(body);
  }

  async function deleteRole(name) {
    try {
      await request("action", "delete", { name });
      clearThumbnailCache();
      closeModal();
      await load(state.page);
      setStatus("已删除角色");
    } catch (error) {
      setStatus(error.message || String(error), true);
    }
  }

  function openUploadForm() {
    revokeUploadPreview();
    const form = make("div", "upload-form");

    const nameLabel = make("label");
    nameLabel.append(document.createTextNode("角色名"));
    const nameInput = make("input", "maibot-input");
    nameInput.type = "text";
    nameInput.maxLength = 256;
    nameInput.placeholder = "例如：角色1";
    nameLabel.append(nameInput);

    const fileLabel = make("label");
    fileLabel.append(document.createTextNode("角色图片（JPEG / PNG / WebP）"));
    const fileInput = make("input", "maibot-input");
    fileInput.type = "file";
    fileInput.accept = "image/jpeg,image/png,image/webp";
    fileLabel.append(fileInput);

    const preview = make("img", "upload-preview");
    preview.alt = "待上传图片预览";
    preview.hidden = true;

    const progress = make("p", "muted");
    progress.setAttribute("role", "status");

    const saveButton = make("button", "maibot-button maibot-button-primary", "保存角色");
    saveButton.type = "button";
    saveButton.disabled = true;

    fileInput.addEventListener("change", () => {
      revokeUploadPreview();
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        preview.hidden = true;
        saveButton.disabled = true;
        return;
      }
      uploadPreviewUrl = URL.createObjectURL(file);
      preview.src = uploadPreviewUrl;
      preview.hidden = false;
      saveButton.disabled = false;
    });

    saveButton.addEventListener("click", async () => {
      const file = fileInput.files && fileInput.files[0];
      const name = nameInput.value.trim();
      if (!name) {
        progress.textContent = "请填写角色名";
        progress.className = "error";
        return;
      }
      if (!file) {
        progress.textContent = "请选择一张图片";
        progress.className = "error";
        return;
      }
      saveButton.disabled = true;
      progress.textContent = "正在上传… 0%";
      progress.className = "muted";
      try {
        const result = await uploadRequest("role_image", file, { name }, {
          onProgress: percent => { progress.textContent = `正在上传… ${percent}%`; }
        });
        clearThumbnailCache();
        closeModal();
        await load(1);
        setStatus(result.overwritten ? "已替换角色图片" : "已保存角色");
      } catch (error) {
        progress.textContent = error.message || String(error);
        progress.className = "error";
        saveButton.disabled = false;
      }
    });

    form.append(nameLabel, fileLabel, preview, progress, saveButton);
    openModal("上传角色", form);
    nameInput.focus();
  }

  function revokeUploadPreview() {
    if (uploadPreviewUrl) {
      URL.revokeObjectURL(uploadPreviewUrl);
      uploadPreviewUrl = "";
    }
  }

  replaceFile.addEventListener("change", async () => {
    const file = replaceFile.files && replaceFile.files[0];
    const name = replaceFile.dataset.name;
    if (!file || !name) return;
    setStatus("正在上传…");
    try {
      await uploadRequest("role_image", file, { name }, {
        onProgress: percent => setStatus(`正在上传… ${percent}%`)
      });
      clearThumbnailCache();
      closeModal();
      await load(state.page);
      setStatus("已替换角色图片");
    } catch (error) {
      setStatus(error.message || String(error), true);
    }
  });

  document.querySelector("#modal-close").addEventListener("click", closeModal);
  modal.addEventListener("click", event => {
    if (event.target === modal) closeModal();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !modal.hidden) closeModal();
  });

  document.querySelector("#refresh").addEventListener("click", () => load(state.page));
  document.querySelector("#sort").addEventListener("change", event => {
    state.sort = event.target.value;
    load(1);
  });
  document.querySelector("#search").addEventListener("input", event => {
    window.clearTimeout(searchTimer);
    const value = event.target.value.trim();
    searchTimer = window.setTimeout(() => {
      state.query = value;
      load(1);
    }, 300);
  });
  document.querySelector("#prev").addEventListener("click", () => {
    if (state.page > 1) load(state.page - 1);
  });
  document.querySelector("#next").addEventListener("click", () => {
    if (state.page < state.pages) load(state.page + 1);
  });
  document.querySelector("#upload-new").addEventListener("click", openUploadForm);

  async function start() {
    try {
      await maibot.ready;
      await load(1);
    } catch (error) {
      setStatus(error.message || String(error), true);
    }
  }

  start();
</script>
</body>
</html>
